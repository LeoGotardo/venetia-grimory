# Release: um APK Android assinado por versão, publicado como GitHub Release.
#
# Disparado pela tag anotada `vX.Y.Z` que scripts/release.sh envia — a
# mensagem da tag são as notas da release. Para refazer o build de uma tag
# existente (se falhou), rode pelo Actions (workflow_dispatch).
#
# O build em si é scripts/build-android-release.sh, o mesmo script que roda à
# mão; este arquivo só fornece o que ele precisa a partir dos secrets
# (criados por scripts/setup-release-secrets.sh):
#
#   ANDROID_KEYSTORE_BASE64    base64 da keystore de release (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# A mesma keystore assina toda release: o Android recusa atualização assinada
# por outra chave, então perdê-la obriga o usuário a desinstalar.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente para (re)gerar, ex. v1.2.3"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    name: gera o APK e publica a release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # A plataforma Android do Capacitor 8 compila para Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: install
        run: npm ci

      # O mesmo gate de scripts/release.sh — cobre o re-run manual de uma tag.
      - name: lint e testes
        run: |
          npm run lint
          npm test

      - name: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::secret ANDROID_KEYSTORE_BASE64 não definido — rode scripts/setup-release-secrets.sh"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK assinado
        id: build
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk="$(./scripts/build-android-release.sh | tail -1)"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      # As notas são a mensagem da tag. O checkout traz o commit, não o objeto
      # da tag anotada, então ela é buscada à parte.
      - name: notas da release
        run: |
          git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
          {
            git tag -l --format='%(contents)' "$VERSION" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d'
            echo
            echo "---"
            echo "Android: baixe \`${{ steps.build.outputs.apk }}\` e abra no celular (permita instalar desta fonte uma vez)."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.build.outputs.apk }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$APK" --clobber
            gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$VERSION" "$APK" --title "Grimório de Venetia $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi

      - name: apagar a keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
