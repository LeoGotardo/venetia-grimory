# PRs semanais de atualização, junto com o npm audit de segunda no security.yml.
# Ative "Dependabot security updates" nas configurações do repositório para que
# um alerta novo abra PR na hora, em vez de esperar a segunda.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # A CLI e as plataformas andam juntas: um par desencontrado quebra o
      # `cap sync`.
      capacitor:
        patterns: ["@capacitor/*"]
      # O React 19 recusa react e react-dom em versões diferentes — o build
      # passa e o app abre em branco. Um PR para os dois.
      react:
        patterns: ["react", "react-dom"]
      # Ferramentas de desenvolvimento, menos o Capacitor: a CLI tem de vir no
      # mesmo PR que o core e as plataformas, no grupo acima.
      dev-tooling:
        dependency-type: development
        exclude-patterns: ["@capacitor/*"]
    ignore:
      # O typescript-eslint ainda não aceita o TypeScript 7 (peer < 6.1.0): com
      # ele o `npm ci` falha (ERESOLVE) e o CI não roda. O código compila no 7;
      # tire esta regra quando o typescript-eslint aceitar.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
